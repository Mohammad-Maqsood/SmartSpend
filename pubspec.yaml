name: smart_spend
description: "Smart Spend - a personal expense tracker for Android"
publish_to: 'none'

# versionName+versionCode on Android.
version: 1.1.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # State management: ChangeNotifier stores shared between screens.
  provider: ^6.1.5+1
  # Saves expenses and settings on the device so they survive a restart.
  shared_preferences: ^2.5.6
  # Indian currency (1,23,456.00) and date formatting.
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generates the Android launcher icons from assets/icon (run once:
  # dart run flutter_launcher_icons).
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
